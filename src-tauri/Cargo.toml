[package]
name = "daybook"
version = "0.1.0"
description = "Daily notes for the things you need to work on"
edition = "2024"
rust-version = "1.90"

[lib]
name = "daybook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-debouncer-mini = "0.7"
security-framework = "3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-nspanel = "2.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
ureq = { version = "3", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
